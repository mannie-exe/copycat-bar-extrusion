plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'design.inherent'
base.archivesName = 'copycat-bar-extrusion'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
neoForge {
    version = '21.1.263'
    mods { copycat_bar_extrusion { sourceSet(sourceSets.main) } }
}
dependencies {
    compileOnly('maven.modrinth:create:UjX6dr61') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.register('verifyCreate') {
    inputs.files(configurations.compileClasspath)
    doLast {
        def source = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'maven.modrinth' && it.name == 'create'
        }?.file
        if (source == null) throw new GradleException('Pinned Create artifact missing')
        def digest = java.security.MessageDigest.getInstance('SHA-512').digest(source.bytes).encodeHex().toString()
        if (digest != '11cc8fc049d2f67f6548c7abfada6b82a3adb5c7ca410a742de04bbca76e03862c518721b88d806f6e6d768a4d68531fdb903a85859b25d1484d550cc7bafd4b') {
            throw new GradleException('Create artifact changed; review the rendering hook')
        }
    }
}
tasks.named('check') { dependsOn 'verifyCreate' }
tasks.named('jar', Jar) { from 'LICENSE' }
tasks.named('sourcesJar', Jar) { from 'LICENSE' }
